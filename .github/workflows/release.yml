name: Release
run-name: ${{ github.actor }} is creating release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release this build as'
        required: true
        type: string
        default: 0.X.Y
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build-prod
      - run: npm run build-manifest -- ${{ inputs.version }}
      - run: npm run build-packs
      - run: npm run build-template
      - name: Copy static files
        run: |
          cp LICENSE ./dist/
          cp -r ./static/assets ./dist/assets
          cp -r ./static/lang ./dist/lang
      - name: Zip files
        working-directory: ./dist
        run: zip -r ./heart.zip ./*
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./dist/system.json,./dist/heart.zip"
          tag: ${{ inputs.version }}